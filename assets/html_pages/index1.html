<!DOCTYPE html>
<html>

<head>
    <title>Leaflet Map with Marker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script>
        let map;
        let marker;

        window.addEventListener('message', (event) => {
            console.log("HTML PAGE LOG: EVENT TRIGGERED")
            try {
                const loc = JSON.parse(event.data);
                console.log("HTML PAGE LOG: 📍 Received location:", loc);

                // Check if values are valid
                if (!loc.latitude || !loc.longitude) {
                    console.warn("HTML PAGE LOG: ⚠️ Invalid location data:", loc);
                    return;
                }

                // Create the map once
                if (!map) {
                    console.log("HTML PAGE LOG: 🗺️ Initializing map...");
                    map = L.map('map').setView([loc.latitude, loc.longitude], 10);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        // attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);
                }

                // If marker already exists, move it; otherwise, create one
                if (marker) {
                    marker.setLatLng([loc.latitude, loc.longitude]);
                } else {
                    marker = L.marker([loc.latitude, loc.longitude]).addTo(map);
                    marker.bindPopup(`<b>Lat:</b> ${loc.latitude}<br><b>Lng:</b> ${loc.longitude}`).openPopup();
                }

                // Center map on the marker
                map.setView([loc.latitude, loc.longitude], 12);
            } catch (err) {
                console.error("❌ Error parsing message:", err);
            }
        });
    </script>

</body>

</html>
