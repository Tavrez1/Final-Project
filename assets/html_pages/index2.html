<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Live Location Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Redirect console logs to React Native (optional)
        (function () {
            const oldLog = console.log;
            const oldError = console.error;
            const oldWarn = console.warn;

            function sendToReactNative(level, message) {
                if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                    window.ReactNativeWebView.postMessage(
                        JSON.stringify({ type: "console", level, message })
                    );
                }
            }

            console.log = (...args) => { oldLog(...args); sendToReactNative("log", args.join(" ")); };
            console.error = (...args) => { oldError(...args); sendToReactNative("error", args.join(" ")); };
            console.warn = (...args) => { oldWarn(...args); sendToReactNative("warn", args.join(" ")); };
        })();

        // 🌍 Global references
        let map = null;
        let myMarker = null;
        let otherMarker = null;
        let pendingData = null;

        function initializeMap(lat = 20.5937, lon = 78.9629) {
            console.log("🗺️ Initializing map...");
            map = L.map("map").setView([lat, lon], 15);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "&copy; OpenStreetMap contributors",
            }).addTo(map);

            // 🧭 Primary marker (your location)
            myMarker = L.marker([lat, lon]).addTo(map);
            myMarker.bindPopup(`Loading your location...`, { autoClose: false, closeOnClick: false }).openPopup();

            // 🧍‍♀️ Secondary marker (other location) – created later dynamically
            otherMarker = null;

            // Apply any queued update once map is ready
            if (pendingData) {
                console.log("⚡ Applying queued update...");
                updateMap(pendingData);
                pendingData = null;
            }
        }

        function updateMap(data) {
            if (!map || !myMarker) {
                console.log("🕐 Map not ready yet. Queuing update...");
                pendingData = data;
                return;
            }

            const { mylocation, otherLocations } = data || {};
            if (!mylocation?.latitude || !mylocation?.longitude) {
                console.warn("⚠️ Invalid mylocation:", mylocation);
                return;
            }

            const { latitude, longitude } = mylocation;
            myMarker.setLatLng([latitude, longitude]);
            myMarker.setPopupContent(
                `You are here:<br>${latitude.toFixed(5)}, ${longitude.toFixed(5)}`
            );

            // 🟢 Handle Other Location marker
            // Store multiple markers
            let otherMarkers = {}; // key = index or unique ID

            // 🟢 Handle Other Location markers (array)
            if (Array.isArray(otherLocations) && otherLocations.length > 0) {

                // Loop through each location in the array
                otherLocations.forEach((loc, index) => {
                    if (!loc?.latitude || !loc?.longitude) return;

                    const { latitude: oLat, longitude: oLon } = loc;

                    // If marker for this index does not exist, create it
                    if (!otherMarkers[index]) {
                        console.log("➕ Creating marker for otherPerson:", index);

                        const marker = L.marker([oLat, oLon]).addTo(map);

                        marker.bindPopup(
                            `Person ${index + 1}:<br>${oLat.toFixed(5)}, ${oLon.toFixed(5)}`,
                            { autoClose: false, closeOnClick: false }
                        ).openPopup();

                        otherMarkers[index] = marker;
                    }

                    // Update popup + position
                    otherMarkers[index].setPopupContent(
                        `Person ${index + 1}:<br>${oLat.toFixed(5)}, ${oLon.toFixed(5)}`
                    );

                    otherMarkers[index].setLatLng([oLat, oLon]);
                });

                // 🧹 Remove markers that no longer exist in the array
                Object.keys(otherMarkers).forEach((key) => {
                    if (!otherLocations[key]) {
                        console.log("➖ Removing old marker:", key);
                        map.removeLayer(otherMarkers[key]);
                        delete otherMarkers[key];
                    }
                });

            } else {
                // 🚫 No locations → remove all markers
                Object.values(otherMarkers).forEach(marker => map.removeLayer(marker));
                otherMarkers = {};
            }


            // Optional: fit both points in view
            // Fit map to all markers (optional)
            if (myMarker || Object.keys(otherMarkers).length > 0) {
                const allPoints = [];

                if (myMarker) {
                    allPoints.push(myMarker.getLatLng());
                }

                Object.values(otherMarkers).forEach(marker => {
                    allPoints.push(marker.getLatLng());
                });

                if (allPoints.length > 1) {
                    const bounds = L.latLngBounds(allPoints);
                    map.fitBounds(bounds, { padding: [100, 100] });
                }
            }


            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                window.ReactNativeWebView.postMessage(
                    JSON.stringify({ updated: true, latitude, longitude })
                );
            }
        }

        // ✅ Called repeatedly from React Native
        window.receiveAppMessage = function (data) {
            try {
                if (!data) return;
                updateMap(data);
                console.log("✅data :" +  JSON.stringify(data.otherLocations))
            } catch (err) {
                console.error("❌ Error in receiveAppMessage:", err);
            }
        };

        // Android/iOS compatibility
        function handleMessage(event) {
            try {
                const data = JSON.parse(event.data);
                window.receiveAppMessage(data);
            } catch (err) {
                console.error("❌ Error parsing message:", err, event.data);
            }
        }

        document.addEventListener("message", handleMessage);
        window.addEventListener("message", handleMessage);

        document.addEventListener("DOMContentLoaded", () => {
            initializeMap();
            console.log("✅ Map initialized and waiting for updates...");
        });
    </script>

</body>

</html>
