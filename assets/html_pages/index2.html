<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Live Location Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Redirect console logs to React Native (optional)
        (function () {
            const oldLog = console.log;
            const oldError = console.error;
            const oldWarn = console.warn;

            function sendToReactNative(level, message) {
                if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                    window.ReactNativeWebView.postMessage(
                        JSON.stringify({ type: "console", level, message })
                    );
                }
            }

            console.log = (...args) => { oldLog(...args); sendToReactNative("log", args.join(" ")); };
            console.error = (...args) => { oldError(...args); sendToReactNative("error", args.join(" ")); };
            console.warn = (...args) => { oldWarn(...args); sendToReactNative("warn", args.join(" ")); };
        })();

        // 🌍 Global references
        let map = null;
        let myMarker = null;
        let otherMarker = null;
        let pendingData = null;

        function initializeMap(lat = 20.5937, lon = 78.9629) {
            console.log("🗺️ Initializing map...");
            map = L.map("map").setView([lat, lon], 15);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "&copy; OpenStreetMap contributors",
            }).addTo(map);

            // 🧭 Primary marker (your location)
            myMarker = L.marker([lat, lon]).addTo(map);
            myMarker.bindPopup(`Loading your location...`, { autoClose: false, closeOnClick: false }).openPopup();

            // 🧍‍♀️ Secondary marker (other location) – created later dynamically
            otherMarker = null;

            // Apply any queued update once map is ready
            if (pendingData) {
                console.log("⚡ Applying queued update...");
                updateMap(pendingData);
                pendingData = null;
            }
        }

        function updateMap(data) {
            if (!map || !myMarker) {
                console.log("🕐 Map not ready yet. Queuing update...");
                pendingData = data;
                return;
            }

            const { mylocation, otherLocation } = data || {};
            if (!mylocation?.latitude || !mylocation?.longitude) {
                console.warn("⚠️ Invalid mylocation:", mylocation);
                return;
            }

            const { latitude, longitude } = mylocation;
            myMarker.setLatLng([latitude, longitude]);
            myMarker.setPopupContent(
                `You are here:<br>${latitude.toFixed(5)}, ${longitude.toFixed(5)}`
            );

            // 🟢 Handle Other Location marker
            if (otherLocation?.latitude && otherLocation?.longitude && otherLocation?.latitude!== latitude && otherLocation?.longitude !== longitude) {
                const { latitude: oLat, longitude: oLon } = otherLocation;

                if (!otherMarker) {
                    console.log("➕ Creating otherLocation marker...");
                    otherMarker = L.marker([oLat, oLon], {
                        //    icon: L.icon({
                        //        iconUrl:
                        //            "https://cdn-icons-png.flaticon.com/512/64/64113.png", // 🧭 You can replace this icon
                        //        iconSize: [32, 32],
                        //        iconAnchor: [16, 32],
                        //    }),
                    }).addTo(map);
                    otherMarker
                        .bindPopup(
                            `Other person:<br>${oLat.toFixed(5)}, ${oLon.toFixed(5)}`,
                            { autoClose: false, closeOnClick: false }
                        )
                        .openPopup();
                }

                otherMarker.setPopupContent(
                    `Other person:<br>${oLat.toFixed(5)}, ${oLon.toFixed(5)}`
                );

                otherMarker.setLatLng([oLat, oLon]);

            } else {
                // 🚫 If otherLocation invalid or missing, remove its marker
                if (otherMarker) {
                    console.log("➖ Removing otherLocation marker...");
                    map.removeLayer(otherMarker);
                    otherMarker = null;
                }
            }

            // Optional: fit both points in view
            if (myMarker && otherMarker) {
                const bounds = L.latLngBounds([
                    myMarker.getLatLng(),
                    otherMarker.getLatLng(),
                ]);
                map.fitBounds(bounds, { padding: [100, 100] });
            }

            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                window.ReactNativeWebView.postMessage(
                    JSON.stringify({ updated: true, latitude, longitude })
                );
            }
        }

        // ✅ Called repeatedly from React Native
        window.receiveAppMessage = function (data) {
            try {
                if (!data) return;
                updateMap(data);
            } catch (err) {
                console.error("❌ Error in receiveAppMessage:", err);
            }
        };

        // Android/iOS compatibility
        function handleMessage(event) {
            try {
                const data = JSON.parse(event.data);
                window.receiveAppMessage(data);
            } catch (err) {
                console.error("❌ Error parsing message:", err, event.data);
            }
        }

        document.addEventListener("message", handleMessage);
        window.addEventListener("message", handleMessage);

        document.addEventListener("DOMContentLoaded", () => {
            initializeMap();
            console.log("✅ Map initialized and waiting for updates...");
        });
    </script>

</body>

</html>
