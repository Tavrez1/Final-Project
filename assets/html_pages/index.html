<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="
    https://cdn.jsdelivr.net/npm/lucide-react@0.545.0/dist/cjs/lucide-react.min.js
    "></script>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>

        function sendLogsFromHTMLPage(message) {
            window.ReactNativeWebView.postMessage("---------------------------------------------");
            window.ReactNativeWebView.postMessage(message);
            window.ReactNativeWebView.postMessage("---------------------------------------------");
        }

        sendLogsFromHTMLPage("hi")

        window.addEventListener('message', (e) => {
            try {
                sendLogsFromHTMLPage(e.data)
            }
            catch (e) {
                sendLogsFromHTMLPage(e)
            }
        })
    </script>


</body>

</html>
